name: NetHunt -> Meta Conversions API

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # кожні 15 хв
  workflow_dispatch:

concurrency:
  group: meta-capi
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python meta_capi.py
        env:
          NETHUNT_EMAIL: ${{ secrets.NETHUNT_EMAIL }}
          NETHUNT_API_KEY: ${{ secrets.NETHUNT_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_TEST_EVENT_CODE: ${{ secrets.META_TEST_EVENT_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
